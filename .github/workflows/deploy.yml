name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a redeploy from the Actions tab without pushing an empty commit.
  workflow_dispatch:

# Required by the OIDC-based Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time, and never abort one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Deliberately WITHOUT `static_site_generator: next`. That input makes the
      # action inject its own basePath into the Next.js config and disable image
      # optimization — overwriting next.config.ts, which is this project's single
      # source of truth for the base path (see CLAUDE.md section 3).
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # Typecheck + lint + format, per CLAUDE.md section 6. A failure here stops
      # the deploy, so broken code cannot reach production.
      - name: Check
        run: npm run check

      - name: Build static export
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
