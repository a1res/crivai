name = "crivai-worker"
main = "src/index.ts"
compatibility_date = "2026-08-11"

# No KV namespace, no D1, no R2, no Durable Objects — and that is deliberate.
# Crivai is local-first: resume data lives in the user's browser and there is no
# database of resumes to leak (CLAUDE.md section 5). The Worker exists only so
# that the LLM API key is never shipped to the browser.
#
# The API key is set with `wrangler secret put`, never committed:
#   wrangler secret put LLM_API_KEY
#
# Observability is left off by default. If it is ever enabled, keep the
# retention short and never log resume content or job descriptions — those are
# personal data under the LGPD.
[observability]
enabled = false
